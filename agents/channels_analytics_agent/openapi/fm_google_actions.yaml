    get:
      operationId: getChannelsDictionary
      summary: Получить справочник телеканалов
      description: Возвращает опубликованный Google Sheets CSV со справочником телеканалов.
      parameters:
        - name: gid
          in: query
          required: true
          schema:
            type: integer
            default: 0
        - name: single
          in: query
          required: false
          schema:
            type: boolean
            default: true
        - name: output
          in: query
          required: false
          schema:
            type: string
            enum: [csv]
            default: csv
      responses:
        "200":
          description: CSV со справочником телеканалов.
          content:
            text/plain:
              schema:
                type: string

